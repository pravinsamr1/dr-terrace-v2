<!DOCTYPE html><html lang="en" style="width: 390px; height: 884px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Notifications Center</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><style type="text/css"></style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#0052cc',
              600: '#0047b3',
              700: '#003a94',
              900: '#00225c'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styling -->
<style data-purpose="base-layout">
    /* iOS Safe area simulation and smooth scrollbar suppression */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style data-purpose="badge-indicator">
    /* Subtle pulsing effect for the active unread notification dot */
    @keyframes subtle-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    .pulse-dot {
      animation: subtle-pulse 2.2s infinite ease-in-out;
    }
  </style>
<!-- END: Custom Styling -->
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center items-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: Mobile Container (iOS Form Factor) -->
<div class="w-full max-w-[420px] h-[100dvh] max-h-[920px] bg-slate-50 flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[40px] sm:border-[8px] sm:border-slate-800" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: Top Bar & Status Simulation -->
<header class="bg-brand-600 text-white shrink-0 pt-3 pb-4 px-4 shadow-md relative z-20" data-purpose="app-header">
<!-- Status Bar Row (iOS simulation) -->
<div class="flex justify-between items-center text-xs font-semibold px-2 pb-3 opacity-90 tracking-tight" data-purpose="status-bar">
<span class="">4:09</span>
<div class="flex items-center space-x-1.5 text-[10px]">
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.58 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path></svg>
<span class="font-bold text-[11px]">5G</span>
<div class="w-5 h-2.5 border border-white rounded-sm p-0.5 flex items-center">
<div class="h-full w-4/5 bg-white rounded-xs"></div>
</div>
</div>
</div>
<!-- Navigation & Title Row -->
<div class="flex items-center justify-between mt-1">
<div class="flex items-center space-x-3">
<!-- Back button with subtle circle touch state -->
<button aria-label="Go back" class="w-9 h-9 rounded-full bg-white/15 active:bg-white/25 flex items-center justify-center transition-colors focus:outline-none">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex items-baseline space-x-2">
<h1 class="text-xl font-bold tracking-tight text-white">Notifications</h1>
<!-- Unread Badge Counter -->
<span class="px-2 py-0.5 text-xs font-semibold bg-blue-400/40 text-blue-100 rounded-full border border-blue-300/30">2</span>
</div>
</div>
<!-- Mark all read action button -->
<button class="text-xs font-medium bg-white/15 hover:bg-white/20 active:bg-white/30 text-white px-3 py-1.5 rounded-full transition-all flex items-center space-x-1 border border-white/20 shadow-sm" data-purpose="mark-all-action" id="mark-all-read-btn">
<svg class="w-3.5 h-3.5 text-blue-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Mark all read</span>
</button>
</div>
<!-- Filter Categories Bar -->
<nav aria-label="Notification filters" class="flex space-x-2 mt-4 overflow-x-auto no-scrollbar py-0.5 text-xs font-medium" data-purpose="filter-pills">
<button class="px-3.5 py-1.5 rounded-full bg-white text-brand-700 shadow-sm font-semibold shrink-0">All</button>
<button class="px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 hover:bg-white/25 shrink-0 transition-colors">Payments</button>
<button class="px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 hover:bg-white/25 shrink-0 transition-colors">Security</button>
<button class="px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 hover:bg-white/25 shrink-0 transition-colors">Account</button>
<button class="px-3.5 py-1.5 rounded-full bg-white/15 text-white/90 hover:bg-white/25 shrink-0 transition-colors">System</button>
</nav>
</header>
<!-- END: Top Bar & Status Simulation -->
<!-- BEGIN: Notifications Scrollable Feed -->
<main class="flex-1 overflow-y-auto px-4 py-3 space-y-4 no-scrollbar pb-24" data-purpose="notification-feed">
<!-- Section: Today -->
<section aria-labelledby="today-heading">
<div class="flex items-center justify-between mb-2.5 px-1">
<h2 class="text-xs font-bold uppercase tracking-wider text-slate-400" id="today-heading">Today</h2>
<span class="text-[11px] text-brand-600 font-medium cursor-pointer">Clear new</span>
</div>
<div class="space-y-3">
<!-- Notification Card 1: Payment verified (Unread - Featured in Screenshot) -->
<article class="relative bg-white rounded-2xl p-4 shadow-sm border border-blue-100 hover:shadow-md transition duration-200 overflow-hidden" data-purpose="notification-card">
<!-- Blue accent vertical indicator for unread -->

<div class="flex items-start gap-3.5 pl-1">
<!-- Emerald Verification Icon Badge -->
<div class="w-12 h-12 rounded-2xl bg-emerald-100/80 flex items-center justify-center shrink-0 shadow-inner text-emerald-600">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Content details -->
<div class="flex-1 min-w-0">
<div class="flex items-start justify-between gap-1">
<h3 class="text-sm font-bold text-slate-900 leading-snug">Payment verified</h3>
<div class="flex items-center space-x-1.5 shrink-0">
<span class="text-[11px] font-medium text-slate-400">Just now</span>
<!-- Unread glowing dot -->
<span class="w-2 h-2 rounded-full bg-brand-600 pulse-dot" title="Unread notification"></span>
</div>
</div>
<p class="text-xs text-slate-600 mt-1 leading-relaxed">
                  Your recorded payment of <span class="font-semibold text-slate-800">$1,250.00</span> was successfully verified by the admin.
                </p>
<!-- Tags & Action Row -->
<div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100">
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-medium bg-blue-50 text-brand-600 border border-blue-100/60">
<svg class="w-3 h-3 text-brand-500" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path>
</svg>
                    Personal
                  </span>
<button class="text-xs font-semibold text-brand-600 hover:text-brand-700 active:text-brand-800 flex items-center gap-1 transition-colors">
<span class="">View receipt</span>
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</div>
</article>
<!-- Notification Card 2: Security Alert (Unread) -->

</div>
</section>
<!-- Section: Yesterday -->

<!-- All caught up notice -->
<div class="py-6 text-center text-xs text-slate-400 flex flex-col items-center gap-1.5" data-purpose="caught-up-indicator">
<div class="w-8 h-8 rounded-full bg-slate-200/70 flex items-center justify-center text-slate-500 mb-1">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="font-medium text-slate-500">You're all caught up!</p>
<p class="text-[11px] text-slate-400">No older notifications to show.</p>
</div>
</main>
<!-- END: Notifications Scrollable Feed -->
<!-- BEGIN: Bottom Navigation Bar -->
<!-- Matches the screenshot navigation pill design with active and inactive states -->
<nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-4 pt-2.5 pb-6 flex justify-around items-center z-30 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]" data-purpose="bottom-navigation">
<!-- Home tab (Active Pill Style in reference) -->
<button aria-label="Home tab" class="flex items-center gap-2 bg-blue-50/90 text-brand-600 px-4 py-2 rounded-full font-semibold text-xs border border-blue-100/70 transition-all shadow-xs">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
<span class="">Home</span>
</button>
<!-- Search tab -->
<button aria-label="Search" class="p-2 text-slate-400 hover:text-slate-700 active:scale-95 transition">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Customer Support / Headphones tab -->
<button aria-label="Customer Support" class="p-2 text-slate-400 hover:text-slate-700 active:scale-95 transition">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M18 10a6 6 0 10-12 0v5c0 1.657 1.343 3 3 3h.5a1.5 1.5 0 001.5-1.5v-3A1.5 1.5 0 009.5 12H7V9.5a5 5 0 0110 0V12h-2.5a1.5 1.5 0 00-1.5 1.5v3a1.5 1.5 0 001.5 1.5h.5c1.657 0 3-1.343 3-3v-5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Settings / Preferences tab -->
<button aria-label="Settings" class="p-2 text-slate-400 hover:text-slate-700 active:scale-95 transition">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Menu / Drawer tab -->
<button aria-label="Main menu" class="p-2 text-slate-400 hover:text-slate-700 active:scale-95 transition">
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: Bottom Navigation Bar -->
<!-- BEGIN: Home Indicator (iOS Bar) -->
<div aria-hidden="true" class="absolute bottom-1 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-slate-300 rounded-full z-40 pointer-events-none"></div>
<!-- END: Home Indicator -->
</div>
<!-- END: Mobile Container -->
<!-- BEGIN: Interactive Feedback Script -->
<script data-purpose="toggle-read-status">
    document.addEventListener('DOMContentLoaded', () => {
      const markAllBtn = document.getElementById('mark-all-read-btn');
      
      if (markAllBtn) {
        markAllBtn.addEventListener('click', () => {
          // Remove unread dots
          const dots = document.querySelectorAll('.pulse-dot');
          dots.forEach(dot => dot.remove());

          // Remove blue accent borders from unread cards
          const borders = document.querySelectorAll('.bg-brand-500.rounded-l-2xl');
          borders.forEach(b => b.remove());

          // Change button appearance to indicate success
          markAllBtn.innerHTML = `
            <svg class="w-3.5 h-3.5 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span>All read</span>
          `;
          markAllBtn.classList.add('opacity-75', 'pointer-events-none');
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Script -->


</body></html>
